# =============================================================================
# anubis-os-macbook — recipe-macbook.yml
# =============================================================================
# Variant of anubis-os for Intel MacBook Air / Pro 2013–2017 (pre-T2 chip).
#
# What's different from the main recipe:
#   • Broadcom Wi-Fi:  akmod-wl (rebuilds on kernel update) + kmod-wl +
#                      broadcom-wl (pre-built module + firmware so Wi-Fi works
#                      on the very first boot, before akmods has finished).
#   • FaceTime HD:     out-of-tree webcam driver via COPR akmod.
#   • Power:           TLP for aggressive battery saving on 2013-era hardware
#                      where battery life matters more than peak performance.
#
# Everything else (CachyOS kernel, debloat, app set, security tools, GNOME
# extensions, Brew, branding) is identical to the main recipe.
#
# Apple Silicon (M1/M2/M3) is OUT OF SCOPE — those need Asahi Linux.
# =============================================================================

name: anubis-os-macbook
description: anubis-os tuned for 2013-2017 Intel MacBook Air/Pro (Broadcom Wi-Fi, FaceTime HD webcam, battery-life tuning). Minimal Fedora 44 + GNOME.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

alt-tags:
  - latest

modules:

  # =========================================================================
  # 1. REPOSITORY HYGIENE (identical to main recipe)
  # =========================================================================
  - type: script
    snippets:
      - echo '[anubis-os-macbook] Cleaning broken repos and ensuring RPM Fusion...'
      - find /etc/yum.repos.d/ -type f -name '*.repo' -exec grep -q 'negativo17.org' {} \; -delete 2>/dev/null || true
      - |
        if ! rpm -q rpmfusion-free-release &>/dev/null; then
          VER=$(rpm -E %fedora)
          rpm-ostree install --idempotent \
            https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${VER}.noarch.rpm \
            https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-${VER}.noarch.rpm \
            || true
        fi

  # =========================================================================
  # 2. CODECS & MULTIMEDIA (identical to main recipe)
  # =========================================================================
  - type: rpm-ostree
    install:
      - ffmpeg
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugins-ugly-free
      - gstreamer1-plugins-good
      - gstreamer1-plugin-libav

  # =========================================================================
  # 3. CACHYOS KERNEL (identical to main recipe)
  #    Generic build — these machines are old enough that CPU-tuned variants
  #    provide no measurable benefit. The generic CachyOS kernel already
  #    includes all the scheduler and tuning patches that matter.
  # =========================================================================
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/repo/fedora-%OS_VERSION%/bieszczaders-kernel-cachyos-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-%OS_VERSION%/bieszczaders-kernel-cachyos-addons-fedora-%OS_VERSION%.repo
    install:
      - kernel-cachyos
      - kernel-cachyos-devel
      - scx-scheds

  # =========================================================================
  # 4. MACBOOK-SPECIFIC HARDWARE ENABLEMENT
  #    Uses BlueBuild's `akmods` module type for proper kernel module building.
  #    akmod-wl + kmod-wl + broadcom-wl: Broadcom Wi-Fi (pre-built for image kernel,
  #                rebuilds on kernel updates via akmods service at boot).
  #    akmod-facetimehd + facetimehd-firmware: FaceTime HD webcam driver from COPR.
  # =========================================================================
  - type: akmods
    kernels:
      - kernel-cachyos
      - kernel-cachyos-devel
    rpms:
      - akmod-wl
      - kmod-wl
      - broadcom-wl

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/dani/facetimehd/repo/fedora-%OS_VERSION%/dani-facetimehd-fedora-%OS_VERSION%.repo
    install:
      - akmod-facetimehd
      - facetimehd-firmware

  # =========================================================================
  # 5. GENERAL HARDWARE + POWER MANAGEMENT
  #    TLP: aggressive power saving for 2013-era hardware. On old MacBooks
  #    battery life is the #1 concern, so TLP's defaults (which trade a small
  #    amount of peak performance for significant battery extension) are the
  #    right call. tuned-ppd is still installed for the GNOME power-profiles
  #    D-Bus API, but TLP takes precedence for actual tuning.
  # =========================================================================
  - type: rpm-ostree
    install:
      - fwupd
      - NetworkManager
      - bluez
      - plymouth
      - plymouth-plugin-script
      - dracut-tools
      - tlp
      - tlp-rdw

  - type: script
    snippets:
      # TLP and tuned both manage power; TLP wins on MacBooks.
      # Disable tuned to avoid conflict, enable TLP.
      - systemctl disable tuned.service 2>/dev/null || true
      - systemctl enable tlp.service
      - systemctl enable irqbalance.service

  # =========================================================================
  # 6. PERFORMANCE & SWAP (identical to main recipe)
  # =========================================================================
  - type: rpm-ostree
    install:
      - irqbalance
      - zram-generator
      - gamemode

  # =========================================================================
  # 7. DEBLOAT GNOME (identical to main recipe)
  # =========================================================================
  - type: script
    scripts:
      - 00-debloat-gnome.sh

  # =========================================================================
  # 8. MINIMAL APPLICATION SET (identical to main recipe)
  # =========================================================================
  - type: rpm-ostree
    install:
      - nautilus
      - blackbox-terminal
      - firefox
      - htop
      - fastfetch

  # =========================================================================
  # 9. CYBERSECURITY TOOLKIT (identical to main recipe)
  # =========================================================================
  - type: rpm-ostree
    install:
      - nmap
      - nmap-ncat
      - whois
      - traceroute
      - net-tools
      - tcpdump
      - bind-utils
      - firewalld
      - firejail
      - opensnitch
      - clamav
      - clamav-update
      - rkhunter
      - aide
      - git
      - vim
      - curl
      - wget
      - python3
      - python3-pip

  # =========================================================================
  # 10. GNOME EXTENSIONS (identical to main recipe)
  # =========================================================================
  - type: gnome-extensions
    install:
      - Dash to Dock
      - AppIndicator and KStatusNotifierItem Support
      - Blur my Shell
      - Caffeine

  # =========================================================================
  # 11. FLATHUB + BAZAAR (identical to main recipe)
  # =========================================================================
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - io.github.kolunmi.Bazaar

  # =========================================================================
  # 12. HOMEBREW (identical to main recipe)
  # =========================================================================
  - type: brew

  # =========================================================================
  # 13. STATIC FILES (identical to main recipe)
  # =========================================================================
  - type: files
    files:
      - source: system
        destination: /

  # =========================================================================
  # 14. POST-INSTALL SCRIPTS (identical to main recipe)
  # =========================================================================
  - type: script
    scripts:
      - setup-os-release.sh
      - setup-hostname.sh
      - setup-logo.sh
      - setup-plymouth.sh
      - setup-wallpaper.sh
      - enable-gnome-extensions-defaults.sh
      - setup-ohmybash.sh
      - set-permissions.sh
      - enable-first-boot-units.sh

  # =========================================================================
  # 15. SIGNING
  # =========================================================================
  - type: signing
