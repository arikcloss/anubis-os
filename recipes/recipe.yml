# =============================================================================
# anubis-os — recipe.yml (main image)
# =============================================================================
# The cleanest possible Fedora 44 Silverblue base, tuned for performance on
# old, new, and modest hardware.
#
# Design principles:
#   1. MINIMAL  — only Nautilus, Blackbox-terminal, Firefox, Htop, Bazaar,
#                 Brew, and a lean cybersecurity toolkit. Nothing else.
#   2. FAST     — tuned + zram + irqbalance.
#   3. STABLE   — every script is idempotent, fault-tolerant, and logged.
#   4. HARMONIOUS — the container image and the ISO share the exact same recipe,
#                 so what you test in the container is what boots from the ISO.
#
# Base image: ghcr.io/ublue-os/silverblue-main (Universal Blue Silverblue)
# =============================================================================

name: anubis-os
description: Minimal, performance-tuned immutable Fedora 44 (Silverblue) with GNOME. Lean cybersecurity toolkit, Brew, and nothing you don't need.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

# -----------------------------------------------------------------------------
# Shared variables — substituted by BlueBuild at build time.
# -----------------------------------------------------------------------------
alt-tags:
  - latest

modules:

  # =========================================================================
  # 1. REPOSITORY HYGIENE
  #    The ublue silverblue-main base ships a negativo17 fedora-multimedia
  #    repo that 404s on Fedora 42+ and poisons every subsequent dnf call.
  #    Nuke it first, then ensure RPM Fusion release packages are present.
  #    Done as a snippet (not a script file) so it runs before anything else
  #    and cannot be accidentally reordered below the packages that need it.
  # =========================================================================
  - type: script
    snippets:
      - echo '[anubis-os] Cleaning broken repos and ensuring RPM Fusion...'
      # Remove the negativo17 repo that 404s — safe if absent.
      - find /etc/yum.repos.d/ -type f -name '*.repo' -exec grep -q 'negativo17.org' {} \; -delete 2>/dev/null || true
      # Ensure RPM Fusion release packages are installed (idempotent).
      # The base image already has RPM Fusion enabled, but if a future base
      # revision drops it, this reinstalls it from the official mirror.
      - |
        if ! rpm -q rpmfusion-free-release &>/dev/null; then
          VER=$(rpm -E %fedora)
          rpm-ostree install --idempotent \
            https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${VER}.noarch.rpm \
            https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-${VER}.noarch.rpm \
            || true
        fi

  # =========================================================================
  # 2. CODECS & MULTIMEDIA
  #    Full ffmpeg for media playback. RPM Fusion is guaranteed available
  #    after step 1.  This is intentionally separate from the kernel step
  #    so a codec failure doesn't block the kernel install.
  # =========================================================================
  - type: rpm-ostree
    install:
      - ffmpeg
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugins-ugly-free
      - gstreamer1-plugins-good
      - gstreamer1-plugin-libav

  # =========================================================================
  # 4. HARDWARE ENABLEMENT
  #    plymouth + dracut-tools: boot splash + initramfs inspection tools
  #    (fwupd, NetworkManager, bluez are in base image)
  # =========================================================================
  - type: rpm-ostree
    install:
      - plymouth
      - plymouth-plugin-script
      - dracut-tools

  # =========================================================================
  # 5. PERFORMANCE & RESPONSIVENESS TUNING
  #    tuned + tuned-ppd: adaptive performance profiles (replaces
  #                       power-profiles-daemon; tuned-ppd provides the
  #                       power-profiles-daemon D-Bus API for GNOME).
  #    irqbalance: distributes IRQs across CPUs for lower latency.
  #    zram-generator: compressed swap in RAM — critical for low-memory
  #                    hardware (2-4 GB RAM old laptops). Configured with a
  #                    sensible default via the static files in step 11.
  #    gamemode: lightweight CPU/governor optimization on demand. Kept even
  #              in the minimal image because it's tiny and useful for any
  #              CPU-intensive task, not just games.
  # =========================================================================
  - type: rpm-ostree
    install:
      - tuned
      - tuned-ppd
      - irqbalance
      - zram-generator
      - gamemode

  - type: script
    snippets:
      - systemctl enable tuned.service
      - systemctl enable irqbalance.service

  # =========================================================================
  # 6. DEBLOAT — strip the Silverblue base image down to bare GNOME
  #    The ublue silverblue-main image ships with the full Fedora GNOME app
  #    set (Calendar, Weather, Maps, Clocks, Contacts, Music, Photos, Videos,
  #    Calculator, etc.). The user wants NONE of these — only Nautilus,
  #    Blackbox-terminal, Firefox, and Htop.
  #
  #    This is a SCRIPT (not a recipe `remove:` key) because rpm-ostree
  #    override remove fails the entire batch if ANY package is missing or
  #    has a dependent. The script filters to only installed packages first,
  #    so it survives Fedora 44 package renames and base image changes.
  # =========================================================================
  - type: script
    scripts:
      - 00-debloat-gnome.sh

  # =========================================================================
  # 7. MINIMAL APPLICATION SET — a usable, lean GTK4 base
  #    Core apps (all available as Fedora RPMs so they work OFFLINE, baked
  #    straight into /usr — no Flatpak, no first-boot download):
  #    nautilus:           file manager
  #    blackbox-terminal:  terminal emulator
  #    firefox:            web browser
  #    htop:               process monitor
  #    gnome-text-editor:  GTK4 text editor
  #    gnome-console:      GTK4 terminal (kgx)
  #    gnome-calculator:   GTK4 calculator
  #    file-roller:        archive manager
  #    libreoffice:        office suite
  #    fastfetch:          system info on terminal open (branding)
  #    just:               command runner (for ujust compatibility)
  #    nodejs:             JavaScript runtime
  #    git / git-lfs:      version control
  #    jq:                 JSON processor (used by first-boot scripts)
  #
  #    NOTE: GNOME Circle apps (Mission Center, Gradio, Wike, Amberol, etc.)
  #    have NO Fedora RPM, so they ship as Flatpaks via flatpak preinstall
  #    (see step 8b) and appear right after first boot when network is up.
  # =========================================================================
  - type: rpm-ostree
    install:
      - nautilus
      - blackbox-terminal
      - firefox
      - htop
      - gnome-text-editor
      - gnome-console
      - gnome-calculator
      - file-roller
      - libreoffice
      - fastfetch
      - just
      - nodejs
      - git
      - git-lfs
      - jq

  # =========================================================================
  # 8. CYBERSECURITY TOOLKIT — lean, defensive + network analysis
  #    These are RPM-installable tools that are small and broadly useful.
  #    Heavy pentesting tools (metasploit, hashcat, wireshark, etc.) are
  #    NOT baked in — they're opt-in via `ujust install-pentest-tools`
  #    which spins up a Distrobox container so the base image stays clean.
  # =========================================================================
  - type: rpm-ostree
    install:
      # --- Network analysis ---
      - nmap
      - nmap-ncat
      - whois
      - traceroute
      - net-tools
      - tcpdump
      - bind-utils          # dig, nslookup, host
      # --- Defensive / privacy ---
      - firewalld
      - firejail
      - clamav
      - clamav-update
      - rkhunter
      - aide
      # --- Core dev tools needed by security scripts ---
      - git
      - vim
      - curl
      - wget
      - python3
      - python3-pip

  # =========================================================================
  # 8b. VIRTUALIZATION — libvirtd + QEMU/KVM for virtual machines
  #     Full libvirt stack baked into /usr so VMs work OFFLINE, no first-boot
  #     download. Enables the libvirtd systemd service so `virsh` and
  #     Virt-Manager are ready to create/manage VMs on a normal boot.
  #     Packages:
  #     libvirt:        libvirtd daemon + client (virsh)
  #     virt-install:   CLI to provision VMs from the command line
  #     virt-manager:   GTK GUI to create/manage VMs
  #     qemu-kvm:       QEMU backend (KVM) that libvirtd drives
  #     edk2-ovmf:      UEFI firmware for modern guest OS booting
  #     NOTE: default NAT network is started/autostarted at first use via
  #     `virsh net-start default` (stored in /etc so it persists), so the
  #     base image stays predictable. The libvirt group (polkit) lets any
  #     member manage the daemon without a root password.
  # =========================================================================
  - type: rpm-ostree
    install:
      - libvirt
      - virt-install
      - virt-manager
      - qemu-kvm
      - edk2-ovmf

  - type: script
    snippets:
      - systemctl enable libvirtd.service
      - systemctl enable libvirtd.socket || true

  # =========================================================================
  # 9. GNOME SHELL EXTENSIONS — minimal, high-value set
  #    Dash to Dock:      persistent dock (usability — GNOME without it is
  #                       a fullscreen app grid by default)
  #    AppIndicator:      tray icons for apps like Discord, Telegram, brew
  #    Blur My Shell:     subtle dash/overview blur (lightweight, GPU-cheap)
  #    Caffeine:          inhibit screensaver on demand (practical)
  #
  #    NOT installed: PaperWM (niche, heavy), Arc Menu / Logo Menu (extra
  #    branding complexity, fragile UUIDs). Branding is handled by GDM logo,
  #    Plymouth theme, wallpaper, os-release, and fastfetch ASCII.
  # =========================================================================
  #- type: gnome-extensions
  #  install:
  #     - Dash to Dock
  #    - AppIndicator and KStatusNotifierItem Support
  #    - Blur my Shell
  #    - Caffeine
 #     - Logo Menu
 #     - PaperWM

  # =========================================================================
  # 10. FLATHUB — remote enabled
  #     Ensures the system Flathub remote is present. The GNOME Circle /
  #     productivity Flatpaks (Mission Center, Gradio, Wike, Bazaar, Amberol,
  #     Obsidian, VSCodium, Eyedropper, Fragments, Iotas) ship as static
  #     declarations in /usr/share/flatpak/preinstall.d/ and are installed
  #     automatically on first boot by anubis-flatpak-preinstall.service
  #     (already enabled in the POST-INSTALL step). They have no Fedora RPM.
  # =========================================================================
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo

  # =========================================================================
  # 11. HOMEBREW — the brew-oci layer
  #     Provides a user-space package manager that doesn't touch the OSTree
  #     root. Users install starship, bottom, lazygit, etc. via `brew install`.
  # =========================================================================
  - type: brew

  # =========================================================================
  # 12. STATIC FILES — wallpapers, dconf defaults, sysctl hardening,
  #     systemd units, ujust commands, fastfetch config, branding assets.
  #     Everything under files/system/ is copied verbatim to / in the image.
  # =========================================================================
  - type: files
    files:
      - source: system
        destination: /

  # =========================================================================
  # 13. POST-INSTALL SCRIPTS — branding, theming, and first-boot enablement
  #     ORDER MATTERS: setup-os-release and setup-hostname first (identity),
  #     then visual branding (logo, plymouth, wallpaper), then GNOME defaults
  #     (extensions + dconf), then oh-my-bash skeleton, then permissions,
  #     then first-boot unit enablement.
  # =========================================================================
  - type: script
    scripts:
      # --- Identity ---
      - setup-os-release.sh
      - setup-hostname.sh
      # --- Visual branding ---
      - setup-logo.sh
      - setup-plymouth.sh
      - setup-wallpaper.sh
      # --- GNOME defaults (extensions enabled, wallpaper set via dconf) ---
      - enable-gnome-extensions-defaults.sh
      # --- Terminal/shell skeleton (Oh My Bash + Starship + fastfetch) ---
      - setup-ohmybash.sh
      # --- Permissions & first-boot services ---
      - set-permissions.sh
      - enable-first-boot-units.sh

  # =========================================================================
  # 14. SIGNING — cosign, using the repo's cosign.pub
  #     Signing is ENABLED. The private key is injected by the GitHub Action
  #     via the `cosign_private_key` secret. Local builds can use --no-sign.
  # =========================================================================
  - type: signing
