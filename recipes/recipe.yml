# recipes/recipe.yml
# anubis-os — minimal/DIY GNOME-core desktop, gaming + everyday user security
# (NOT pentesting), broad x86_64 hardware support (1st-gen Intel Core through
# current, all AMD64). No custom kernel — stock Fedora 44 kernel + tuned/sysctl
# optimizations only. No Flatpaks — rpm-only, gnome-core app set.

name: anubis-os
description: GNOME-core-based DIY gaming & security-focused immutable Fedora (Universal Blue)
base-image: ghcr.io/ublue-os/silverblue-main   # GNOME ostree base
image-version: "44"

modules:

  # ---------------------------------------------------------------------
  # 1. Repositories cleanup & base codecs
  #    Remove o repositório multimedia antigo da negativo17 que causa 404
  #    e instala o ffmpeg completo + stack gstreamer/pipewire para codecs.
  # ---------------------------------------------------------------------
  - type: script
    snippets:
      # Versão segura: find -delete não quebra se grep não achar nada.
      - find /etc/yum.repos.d/ -type f -name '*.repo' -exec grep -l 'negativo17.org' {} \; -delete 2>/dev/null || true

  - type: rpm-ostree
    install:
      - ffmpeg
      - firefox
      - blackbox-terminal
      - ffmpeg-libs
      - gstreamer1-vaapi
      - pipewire
      - pipewire-alsa
      - pipewire-pulseaudio
      - pipewire-jack-audio-connection-kit
      - wireplumber

  # ---------------------------------------------------------------------
  # 2. Performance optimizations WITHOUT a custom kernel.
  #    Usa o COPR bieszczaders para buscar o scx-scheds de forma nativa.
  # ---------------------------------------------------------------------
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-%OS_VERSION%/bieszczaders-kernel-cachyos-addons-fedora-%OS_VERSION%.repo
    install:
      - tuned
      - tuned-ppd
      - irqbalance
      - scx-scheds
      - gamemode
      - mangohud
      - vulkan-loader
      - mesa-vulkan-drivers
      - libva
      - libva-utils

  - type: script
    snippets:
      - systemctl enable tuned.service
      - systemctl enable irqbalance.service

  # ---------------------------------------------------------------------
  # 3. Automatic hardware enablement
  # ---------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - fwupd
      - NetworkManager
      - bluez
      - bluez-cups
      - plymouth
      - plymouth-plugin-script
      - dracut-tools
      - iwd
      - power-profiles-daemon

  # ---------------------------------------------------------------------
  # 4. Gaming support (rpm-only, NO LUTRIS, NO STEAM inside base)
  # ---------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - gamescope
      - libdrm
      - libgudev
      - SDL2

  # ---------------------------------------------------------------------
  # 5. DIY / minimal GNOME-core application set.
  # ---------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - gedit
      - ptyxis
      - firefox
      - gnome-tweaks
      - gnome-extensions-app

  - type: script
    snippets:
      - flatpak uninstall -y --noninteractive app/org.gnome.Ptyxis/x86_64/stable || true

  # ---------------------------------------------------------------------
  # 6. Flathub remote — kept enabled "just in case" but with nothing
  #    pre-installed.
  # ---------------------------------------------------------------------
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install: []

  # ---------------------------------------------------------------------
  # 7. Everyday user security
  # ---------------------------------------------------------------------
  - type: rpm-ostree
    install:
      - firewalld
      - clamav
      - clamav-update
      - rkhunter
      - aide
      - firejail

  # ---------------------------------------------------------------------
  # 8. GNOME desktop extensions
  #    Logo Menu substitui o botão "Atividades" por um logo customizável
  #    (UUID: logomenu@aryan_k) — é isso que você pediu.
  # ---------------------------------------------------------------------
  - type: gnome-extensions
    install:
      - Dash to Dock
      - AppIndicator and KStatusNotifierItem Support
      - Blur my Shell
      - Logo Menu
      - Caffeine
      - PaperWM

  # ---------------------------------------------------------------------
  # 9. Homebrew (brew-oci layer)
  # ---------------------------------------------------------------------
  - type: brew

  # ---------------------------------------------------------------------
  # 10. Wallpapers, dconf defaults, ujust files, script setups
  # ---------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - set-permissions.sh
      - enable-first-boot-units.sh
      - enable-gnome-extensions-defaults.sh
      - setup-logo.sh
      - setup-plymouth.sh
      - setup-wallpaper.sh

  # ---------------------------------------------------------------------
  # 11. Signing
  # ---------------------------------------------------------------------
  - type: signing
