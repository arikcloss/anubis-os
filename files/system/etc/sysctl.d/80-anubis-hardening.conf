# =============================================================================
# /etc/sysctl.d/80-anubis-hardening.conf
# =============================================================================
# System-wide kernel hardening defaults for anubis-os.
#
# These settings are ALWAYS APPLIED. They represent a balance between
# security and usability for a general-purpose desktop OS — more hardened
# than stock Fedora, less aggressive than secureblue/military hardening.
#
# For the full secureblue-style aggressive profile (mitigations=auto,nosmt,
# kernel.kptr_restrict=2, etc.), run:
#   ujust enable-hardened-profile
# (That command adds kernel args and enables additional services — see
#  modules/60-anubis.just for details.)
# =============================================================================

# --- Kernel information disclosure ---
# Hide kernel pointers from unprivileged users (prevents kernel address leaks
# that aid exploit development).
kernel.kptr_restrict = 1

# Restrict dmesg to root (unprivileged users can't read kernel logs).
kernel.dmesg_restrict = 1

# --- BPF hardening ---
# Unprivileged users cannot load BPF programs (prevents BPF-based exploits).
kernel.unprivileged_bpf_disabled = 1
# JIT hardening for BPF (constant blinding, etc.)
net.core.bpf_jit_harden = 2

# --- ptrace restriction ---
# Parent processes can only ptrace their direct children (blocks strace/gdb
# on other users' processes). Set to 2 for maximum restriction (even children
# can't be ptraced), but 1 is the desktop-friendly default.
kernel.yama.ptrace_scope = 1

# --- Filesystem hardening ---
# Protected symlinks/hardlinks: only follow symlinks owned by the target's
# owner or if the follower is in the same directory as the symlink.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# Protected fifos/regular files: prevent writing to pipes/files in sticky
# world-writable directories that aren't owned by the writer.
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Network hardening (desktop-safe) ---
# Enable reverse path filtering (drop packets with spoofed source IPs).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Don't accept ICMP redirect messages (prevents MITM via redirect).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
# Log martian packets (packets with impossible source addresses).
net.ipv4.conf.all.log_martians = 1
# Ignore ICMP echo requests (ping) — optional privacy. Comment out if you
# need ping for network diagnostics.
net.ipv4.icmp_echo_ignore_all = 0
# Enable TCP SYN cookies (prevents SYN flood attacks).
net.ipv4.tcp_syncookies = 1

# --- Performance tuning (desktop) ---
# Increase max file watchers (needed for GNOME Shell to track many files).
# Default is 8192; GNOME Shell with many extensions can hit this limit.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# Faster TCP connection recycling (improves browsing responsiveness).
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# --- VM swappiness ---
# With zram enabled, a higher swappiness is actually GOOD — zram is faster
# than disk, so the kernel should prefer compressing cold pages to zram
# rather than keeping them in RAM. 100 means "equal priority for zram and
# RAM eviction", which is the recommended value for zram setups.
vm.swappiness = 100
vm.watermark_boost_factor = 125
vm.watermark_scale_factor = 125

# =============================================================================
# The following settings are NOT applied here — they require kernel args or
# are too aggressive for a general-purpose desktop. Enable via:
#   ujust enable-hardened-profile
# =============================================================================
# kernel.kptr_restrict = 2          # (already 1 above; 2 is more restrictive)
# kernel.yama.ptrace_scope = 2      # (already 1 above; 2 blocks even children)
# kernel.unprivileged_bpf_disabled = 1  # (already set above)
# Plus kernel boot args: mitigations=auto,nosmt
