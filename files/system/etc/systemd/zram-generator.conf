# =============================================================================
# /etc/systemd/zram-generator.conf
# =============================================================================
# Configures zram swap — compressed swap space in RAM.
#
# WHY: On hardware with 2-8 GB RAM (old laptops, modest desktops), disk-based
# swap is catastrophically slow. zram compresses cold memory pages in RAM
# using zstd, effectively giving you ~1.5-2x your physical RAM before any
# swapping happens. This is the single biggest performance win for old
# hardware running a modern desktop.
#
# On systems with 16+ GB RAM, zram is still useful (faster page reclaim) but
# less impactful. It's always enabled because it has zero downside.
#
# SIZE LOGIC: zram-generator defaults to min(ramsize/2, 4G) which is sensible.
# We override to a fixed ratio for consistency across hardware.
# =============================================================================
[zram0]
# Compress cold pages with zstd (best ratio, ~5% CPU overhead).
compression-algorithm = zstd

# Size: half of RAM, capped at 8 GB. On a 4 GB machine → 2 GB zram.
# On a 16 GB machine → 8 GB zram. On a 32 GB machine → 8 GB zram (capped).
# This is the sweet spot recommended by the Fedora zram SIG.
zram-size = min(ram / 2, 8192)

# Swap priority: 100 (highest). If disk swap exists, zram is always preferred.
swap-priority = 100

# Filesystem: ext2 (lightest, fastest for swap-backed tmp).
# This is the default but stated explicitly for clarity.
fs-type = ext2
