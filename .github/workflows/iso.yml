name: Build anubis-os ISO
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build anubis-os images"]
    types: [completed]
    branches: [main]

jobs:
  iso:
    name: ISO (anubis-os)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache BlueBuild CLI
        id: bluebuild-cache
        uses: actions/cache@v4
        with:
          path: /usr/bin/bluebuild
          key: bluebuild-cli-v0.9.37

      - name: Install BlueBuild CLI
        if: steps.bluebuild-cache.outputs.cache-hit != 'true'
        run: |
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image for ISO
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/anubis-os:latest"
          docker pull "$IMAGE"

      - name: Generate ISO
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/anubis-os:latest"
          mkdir -p iso-out
          sudo bluebuild generate-iso \
            --output-dir iso-out \
            --iso-name anubis-os.iso \
            image "$IMAGE"

      - name: Verify ISO
        run: |
          ls -la iso-out/
          file iso-out/*.iso

      - name: Upload ISO artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: iso-anubis-os
          path: iso-out/*.iso
          retention-days: 7
          if-no-files-found: error
