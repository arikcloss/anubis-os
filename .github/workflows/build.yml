name: Build anubis-os images
on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "files/**"
      - "modules/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build-main:
    name: Build (anubis-os)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: recipes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate recipe
        run: |
          python3 -c "import yaml; yaml.safe_load(open('recipe.yml'))" && echo "recipe.yml OK"

      - name: Build image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ""
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          build_opts: "--no-sign"
        env:
          BUILDKIT_PROGRESS: plain
